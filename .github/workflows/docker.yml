name: Build and Publish Docker Image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish-docker-image:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only push artifacts on the main branch or on a new tag
      - name: Determine if Artifacts should be pushed to the Registry
        id: check-push
        run: |
          echo "should-push=${{ github.ref_type == 'tag' || (github.ref_type == 'branch' && github.ref_name == 'main') }}" >> $GITHUB_OUTPUT

      # This step uses metadata-action to extract tags and labels that will be
      # applied to the specified image. The `id` "meta" allows the output of
      # this step to be referenced in a subsequent step. The `images` value
      # provides the base name for the tags and labels.
      # We add the following tags
      # - version tags: for v1.2.3 -> v1, v1.2, v1.2.3
      # - latest tags: for main branch and latest tag -> latest
      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern=v{{major}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
          flavor: |
            latest=false

      - name: Login to GitHub Container Registry
        if: steps.check-push.outputs.should-push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.check-push.outputs.should-push == 'true' }}
          # ARM build disabled for now (QEMU issues). Re-enable when stable.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Artifact Attestation
        if: false # TODO: Enable when attestations are available for user-owned private repos.
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
