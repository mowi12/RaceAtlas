name: Quality Checks

on:
  pull_request:

env:
  node-version: ${{ vars.NODE_VERSION }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/workflows/setup/
        with:
          node_version: ${{ env.node-version }}

      - name: Run Biome
        shell: bash
        run: npm run lint

      - name: Lint Markdown Files
        shell: bash
        run: npm run lint:md

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/workflows/setup/
        with:
          node_version: ${{ env.node-version }}

      - name: Run Tests with Coverage
        run: pnpm test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1
          if-no-files-found: error