name: Quality Checks

on:
  pull_request:

env:
  node-version: ${{ vars.NODE_VERSION }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/workflows/setup/
        with:
          node_version: ${{ env.node-version }}

      - name: Run Biome
        shell: bash
        run: npm run lint

      - name: Lint Markdown Files
        shell: bash
        run: npm run lint:md

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/workflows/setup/
        with:
          node_version: ${{ env.node-version }}

      - name: Run Tests with Coverage
        run: pnpm test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1
          if-no-files-found: error

  coverage-report:
    if: false # TODO: Disabled because of ci pipeline issues (LCOV/genhtml)
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/workflows/setup/
        with:
          node_version: ${{ env.node-version }}

      - name: Download Coverage Report
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: Install LCOV
        run: sudo apt install lcov

      - name: Report Code Coverage
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: coverage/lcov.info
          artifact-name: code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: final-code-coverage-report
          path: ${{ github.workspace }}/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error